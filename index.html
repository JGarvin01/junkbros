<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Junk Bros</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #2a2a2a;
      background: #e1f1d9;
    }

    /* NAVBAR */
    header {
      background: #ffffffcc;
      backdrop-filter: blur(8px);
      position: fixed;
      width: 100%;
      top: 0;
      left: 0;
      border-bottom: 1px solid #ddd;
      z-index: 1000;
    }

    .nav-container {
      max-width: 1000px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
    }

    .logo {
      font-weight: bold;
      letter-spacing: 1px;
    }

    nav a {
      margin-left: 20px;
      text-decoration: none;
      color: #2a2a2a;
      font-weight: 600;
    }

    nav a:hover {
      color: #4a7c59;
    }

    /* HERO */
    .hero {
      margin-top: 70px;
      padding: 80px 20px;
      text-align: center;
      background: linear-gradient(180deg, #b0f889 0%, #e1f1d9 70%);
    }

    .hero h1 {
      font-size: 48px;
      margin: 0;
    }

    .hero p {
      font-size: 22px;
      margin-top: 10px;
    }

    /* SECTIONS */
    section {
      max-width: 900px;
      margin: auto;
      padding: 50px 20px;
    }

    h2 {
      margin-bottom: 20px;
    }

    /* CONTACT */
    .contact-box {
      display: flex;
      flex-wrap: wrap;
      gap: 40px;
    }

    .contact-box div {
      flex: 1;
      min-width: 250px;
    }

    a {
      color: #2a2a2a;
    }

    /* TESTIMONIALS */
    .testimonial {
      background: #f5f5f5;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 10px;
    }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 30px;
      font-size: 14px;
      color: #666;
    }

    /* MOBILE */
    @media (max-width: 600px) {
      .hero h1 {
        font-size: 36px;
      }

      nav {
        display: none;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="nav-container">
    <div class="logo">Junk Bros</div>
    <nav>
      <a href="#home">Home</a>
      <a href="#contact">Contact</a>
      <a href="#testimonials">Testimonials</a>
    </nav>
  </div>
</header>

<!-- HERO -->
<div class="hero" id="home">
  <h1>Junk Bros</h1>
  <p>A Great Company to Work With!</p>
</div>

<!-- CONTACT -->
<section id="contact">
  <h2>Get in Touch With Us</h2>

  <div class="contact-box">
    <div>
      <h3>Email</h3>
      <p><a href="mailto:schedule@junkbros.store">schedule@junkbros.store</a></p>
    </div>

    <div>
      <h3>Phone</h3>
      <p><a href="tel:3127723035">312.772.3035</a></p>
    </div>
  </div>
</section>

<!-- TESTIMONIALS -->
<section id="testimonials">
  <h2>Testimonials</h2>

  <div class="testimonial">
    Great pricing and amazing work!
  </div>

  <div class="testimonial">
    Got the job done quick and it came out great.
  </div>
</section>

<footer>
  © 2026 Junk Bros. All rights reserved.
</footer>

</body>
</html>
